services:
  backend:
    build:
      context: ./backend
      dockerfile: ./src/Dockerfile
    env_file:
      - backend/.env
    volumes:
      - ./backend/src:/src
      - ./backend/pyproject.toml:/pyproject.toml
      - ./backend/uv.lock:/uv.lock
    environment:
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      - redis
    command: ["uv", "run", "manage.py", "runserver", "0.0.0.0:8000"]

  celery:
    build:
      context: ./backend
      dockerfile: ./src/Dockerfile
    command: ["uv", "run", "celery", "-A", "config", "worker", "--loglevel=info"]
    env_file:
      - backend/.env
    volumes:
      - ./backend/src:/src
      - ./backend/pyproject.toml:/pyproject.toml
      - ./backend/uv.lock:/uv.lock
    environment:
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.12
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - network.host=0.0.0.0
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms256m -Xmx1024m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
volumes:
  redis_data:
  es_data:
