services:
  backend:
    build:
      context: ./backend
      dockerfile: ./src/Dockerfile
    env_file:
      - backend/.env
    volumes:
      - ./backend/src:/src
      - ./backend/pyproject.toml:/pyproject.toml
      - ./backend/uv.lock:/uv.lock
    environment:
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - elasticsearch
    command: ["/src/entrypoint.sh"]
    networks:
      - app_net

  celery:
    build:
      context: ./backend
      dockerfile: ./src/Dockerfile
    command: ["uv", "run", "celery", "-A", "config", "worker", "--loglevel=info"]
    env_file:
      - backend/.env
    volumes:
      - ./backend/src:/src
      - ./backend/pyproject.toml:/pyproject.toml
      - ./backend/uv.lock:/uv.lock
    environment:
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
      - redis
    networks:
      - app_net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.12
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - network.host=0.0.0.0
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms256m -Xmx1024m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app_net

volumes:
  redis_data:
  es_data:

networks:
  app_net:
